<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <!-- Simple CSS for a cleaner look -->
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-container { background: #f4f4f4; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: inline-block; width: 120px; font-weight: bold; }
        .error { color: red; font-size: 0.9em; margin-left: 125px; display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        .btn { padding: 5px 10px; text-decoration: none; color: white; border-radius: 4px; border: none; cursor: pointer; }
        .btn-save { background-color: #008CBA; }
        .btn-edit { background-color: #f39c12; }
        .btn-delete { background-color: #e74c3c; }
        .success-msg { color: green; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h2>Employee Management System</h2>

    <!-- SUCCESS MESSAGE -->
    <div th:if="${param.success}" class="success-msg">
        Employee saved successfully!
    </div>

    <!-- FORM TO ADD NEW EMPLOYEE -->
    <div class="form-container">
        <h3>Add New Employee</h3>
        <form th:action="@{/employees}" th:object="${employee}" method="post">
            
            <div class="form-group">
                <label>Full Name:</label>
                <input type="text" th:field="*{fullName}" />
                <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="error"></span>
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" th:field="*{email}" />
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></span>
            </div>

            <div class="form-group">
                <label>Phone (10 digits):</label>
                <input type="text" th:field="*{phone}" />
                <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="error"></span>
            </div>

            <div class="form-group">
                <label>Department:</label>
                <input type="text" th:field="*{department}" />
                <span th:if="${#fields.hasErrors('department')}" th:errors="*{department}" class="error"></span>
            </div>

            <div class="form-group">
                <label>Salary:</label>
                <input type="number" step="0.01" th:field="*{salary}" />
                <span th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}" class="error"></span>
            </div>

            <button type="submit" class="btn btn-save">Save Employee</button>
        </form>
    </div>

    <!-- TABLE TO DISPLAY EMPLOYEES -->
    <h3>Employee List</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Thymeleaf loop to show each employee -->
            <tr th:each="emp : ${employees}">
                <td th:text="${emp.id}"></td>
                <td th:text="${emp.fullName}"></td>
                <td th:text="${emp.email}"></td>
                <td th:text="${emp.phone}"></td>
                <td th:text="${emp.department}"></td>
                <td th:text="${emp.salary}"></td>
                <td>
                    <!-- EDIT BUTTON -->
                    <a th:href="@{/employees/{id}/edit(id=${emp.id})}" class="btn btn-edit">Edit</a>
                    
                    <!-- DELETE BUTTON (must be a POST request for security) -->
                    <form th:action="@{/employees/{id}/delete(id=${emp.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-delete" onclick="return confirm('Are you sure you want to delete this employee?');">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
