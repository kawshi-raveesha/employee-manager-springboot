<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-container { background: #f4f4f4; padding: 20px; border-radius: 8px; width: 50%; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .error { color: red; font-size: 0.9em; }
        .btn { padding: 10px 15px; text-decoration: none; color: white; border-radius: 4px; border: none; cursor: pointer; }
        .btn-update { background-color: #008CBA; }
        .btn-cancel { background-color: #777; margin-left: 10px; }
    </style>
</head>
<body>

    <h2>Edit Employee</h2>

    <div class="form-container">
        <!-- The action points to the /update URL, passing the ID -->
        <form th:action="@{/employees/{id}/update(id=${employee.id})}" th:object="${employee}" method="post">
            
            <div class="form-group">
                <label>Full Name:</label>
                <input type="text" th:field="*{fullName}" style="width: 100%; padding: 8px;" />
                <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="error"></span>
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" th:field="*{email}" style="width: 100%; padding: 8px;" />
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></span>
            </div>

            <div class="form-group">
                <label>Phone (10 digits):</label>
                <input type="text" th:field="*{phone}" style="width: 100%; padding: 8px;" />
                <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="error"></span>
            </div>

            <div class="form-group">
                <label>Department:</label>
                <input type="text" th:field="*{department}" style="width: 100%; padding: 8px;" />
                <span th:if="${#fields.hasErrors('department')}" th:errors="*{department}" class="error"></span>
            </div>

            <div class="form-group">
                <label>Salary:</label>
                <input type="number" step="0.01" th:field="*{salary}" style="width: 100%; padding: 8px;" />
                <span th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}" class="error"></span>
            </div>

            <button type="submit" class="btn btn-update">Update Employee</button>
            <a th:href="@{/employees}" class="btn btn-cancel">Cancel</a>
        </form>
    </div>

</body>
</html>
